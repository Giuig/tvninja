name: tvninja
description: IPTV M3U8 Viewer - Watch your favorite TV channels

publish_to: "none"

version: 1.5.2

environment:
  # 3.4 is ninja_material's floor (unchanged v1.6.0 -> v1.6.3) — it uses `web: ^1.1.0`, which
  # resolves to web-1.1.1, and that declares `sdk: ^3.4.0`. Raised with the ref
  # bump rather than after it: pub resolves the effective floor anyway, so
  # nothing breaks today, but leaving 3.1.2 would mean this app's declared
  # constraint understates what it actually needs.
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  ninja_material:
    git:
      url: https://github.com/Giuig/ninja_material.git
      ref: v1.6.5

  # Used directly by lib/config/config.dart. Declared rather than relied on
  # transitively through ninja_material: an app that imports a package should say
  # so, or a change in the package's own constraint can move this app's storage
  # layer without anything here mentioning it. Matches ninja_material's ^2.5.4,
  # so resolution is unchanged.
  shared_preferences: ^2.5.4

  # IPTV dependencies
  media_kit: ^1.1.11
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.3.8
  http: ^1.2.0
  wakelock_plus: ^1.5.1

  # Android foreground playback (Phase 3): official video_player, backed by
  # video_player_android's Media3/ExoPlayer implementation. Android only —
  # media_kit/mpv remains the engine for iOS/web/desktop (see
  # lib/services/video/engines/). Not better_player, not a custom platform
  # channel (see PLAN.md decision 1).
  video_player: ^2.9.2
  video_player_android: ^2.5.2

  # Background audio - just_audio removed; native_audio_service.dart runs its
  # own media_kit/mpv Player() instance (not ExoPlayer/Media3 - the Kotlin
  # side only uses androidx.media:media for the MediaSession/notification).

  # Database - cross-platform (web + android)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Image caching
  cached_network_image: ^3.4.1

  # Utilities
  path_provider: ^2.1.1
  uuid: ^4.2.1
  collection: ^1.18.0
  web: ^1.1.0
  device_info_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: The Hand
      fonts:
        - asset: assets/fonts/The Hand Regular.otf

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#3F5189"  # pale dark indigo - matches app theme
  adaptive_icon_foreground: "assets/icons/app_icon.png"
