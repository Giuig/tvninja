<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF" />

  <meta charset="UTF-8" />
  <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
  <meta name="description" content="TV Ninja - IPTV Player for Android and Web" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />

  <!-- iOS/Android PWA meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="TV Ninja" />
  <link rel="apple-touch-icon" href="icons/Icon-192.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.ico" />

  <title>TV Ninja - IPTV Player</title>
  <link rel="manifest" href="manifest.json" />

  <!-- HLS.js for IPTV playback on web -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">


  <!-- Shared loading screen, shipped by ninja_material as a package asset.
       In <head> and NOT async on purpose: a head script blocks first paint,
       so the first paint already carries the right background instead of
       flashing white and being corrected a frame later.

       data-prefix MUST match SharedPreferences.setPrefix() in main.dart.
       A wrong prefix does not error, it silently falls back to the colours
       below. Those are this app's real resolved ColorScheme and are the
       first-run fallback only; after one render the app publishes the exact
       palette and the loader uses that instead. -->
  <script src="assets/packages/ninja_material/assets/web/ninja_loader.js"
          data-prefix="tvninja."
          data-bg-light="#fbf8ff" data-bg-dark="#121318"
          data-accent-light="#515b92" data-accent-dark="#bac3ff"
          data-container-light="#efedf4" data-container-dark="#1f1f25"></script>
</head>

<body>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
